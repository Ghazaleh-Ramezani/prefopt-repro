name: dpo_b0.1
stage: dpo
seed: 17
model:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: float32
  attn_implementation: sdpa
  use_peft: true
  load_in_4bit: false
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
data:
  dataset: HuggingFaceH4/ultrafeedback_binarized
  train_split: train_prefs
  eval_split: test_prefs
  sft_train_split: train_sft
  max_train_samples: 1000
  max_eval_samples: 200
  max_prompt_length: 512
  max_length: 1024
  rm_pair_fraction: 1.0
train:
  output_dir: /content/drive/MyDrive/prefopt_small_run/runs/dpo_b0.1
  learning_rate: 5.0e-05
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: false
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  logging_steps: 10
  eval_strategy: 'no'
  eval_steps: 100
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  report_to: none
  deepspeed: null
method:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0
  num_generations: 8
  max_completion_length: 512
  temperature: 0.9
  use_vllm: false
  reward_model_path: null
  length_penalty_weight: 0.0
  rm_num_labels: 1
  packing: true
init_adapter: /content/drive/MyDrive/prefopt_small_run/runs/sft
notes: 'beta is the KL anchor. Sweep {0.01, 0.05, 0.1, 0.5}; expect win-rate to peak
  in the middle and reward-hacking diagnostics to worsen monotonically as beta falls.

  '
