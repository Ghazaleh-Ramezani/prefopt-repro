_base_: base.yaml
name: dpo_b0.1
stage: dpo
init_adapter: runs/sft
train:
  output_dir: runs/dpo_b0.1
  learning_rate: 5.0e-7      # DPO wants a much smaller LR than SFT
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
method:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0
notes: >
  beta is the KL anchor. Sweep {0.01, 0.05, 0.1, 0.5}; expect win-rate to peak
  in the middle and reward-hacking diagnostics to worsen monotonically as beta
  falls.
