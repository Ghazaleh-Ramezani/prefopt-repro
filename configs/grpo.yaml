_base_: base.yaml
name: grpo_g8
stage: grpo
init_adapter: runs/sft
train:
  output_dir: runs/grpo_g8
  learning_rate: 1.0e-6
  num_train_epochs: 1.0
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
method:
  beta: 0.04
  num_generations: 8         # group size G; must divide the effective batch
  max_completion_length: 512
  temperature: 0.9
  use_vllm: false            # true once `trl vllm-serve` is running
  reward_model_path: runs/rm_full
  length_penalty_weight: 0.0 # raise if the length/reward correlation blows up
notes: >
  Group-relative advantages, no value network. Rollout dominates step time
  without vLLM.
